<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lidera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="marca/lidera-favicon.png">
<link rel="apple-touch-icon" href="marca/lidera-app.png">
<meta name="theme-color" content="#0D3B66">
<style>
/* Lidera (by Líderes Locales): sistema de gestión para negocios locales, celular primero, letra grande, semáforo con texto.
   Marca: azul profundo #0D3B66 (estructura), azul eléctrico #2563EB (acciones) y cian #22D3EE (acentos). Fuente Inter. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --soft:#F5F8FC;
  --ink:#0F1C2E; --ink2:#334155; --muted:#526075;
  --line:#E2E8F0; --line2:#CBD5E1;
  --deep:#0D3B66; --cyan:#22D3EE; --cyan-l:#E3F8FC;
  --green:#2563EB; --green-d:#1D4ED8; --green-l:#E7EEFE;
  --rose:#0D3B66; --rose-l:#E3F0FB;
  --ok-bg:#DFF5E8; --ok:#14653A; --warn-bg:#FFEFC9; --warn:#6E4700; --bad-bg:#FCE4E1; --bad:#9A1F17;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
a{color:var(--green-d)}
:focus-visible{outline:3px solid #3B82F6;outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* estructura */
.app{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{flex:1;min-width:0}
.top-logo{width:34px;height:34px;flex:none}
@media (min-width:900px){.top-logo{display:none}}
.top .brand b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand span{font-size:12.5px;color:var(--muted)}
.demo-tag{font-size:12px;font-weight:800;background:#FFEFC9;color:#6E4700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.role{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.role select{min-height:40px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;padding:0 10px;font-size:14px;font-weight:700}
.content{width:100%;max-width:900px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none;background:none;border:none;padding:0}
.bnav .on{color:var(--green)}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;width:250px;flex:none;background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .side .logo{display:flex;align-items:center;gap:10px;padding:2px 10px 14px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .side .logo img{width:46px;height:46px;flex:none}
  .side .logo b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--deep);line-height:1}
  .side .logo small{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin-top:3px}
  .side .neg{font-weight:700;font-size:16.5px;line-height:1.25;padding:2px 12px 0;color:var(--ink)}
  .side .logo-sub{font-size:12.5px;color:var(--muted);padding:0 12px 16px}
  .side a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:12px;color:var(--ink2);text-decoration:none;font-weight:700;font-size:15px}
  .side a:hover{background:var(--soft)}
  .side a.on{background:var(--green-l);color:var(--green-d)}
  .bnav{display:none}
  .content{padding:28px 32px 60px}
}

/* piezas */
h2.v-title{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-.02em}
.v-sub{margin:-8px 0 0;color:var(--muted);font-size:15px}
.nav-g{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 14px 4px}
#bnav .nav-g{display:none}
.accion{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px;text-decoration:none;font-family:inherit;cursor:pointer;text-align:left;border:2px solid transparent;width:100%}
.accion .ai{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.accion b{display:block;font-size:19px;line-height:1.2}
.accion span.as{display:block;font-size:14px;font-weight:600;opacity:.85;margin-top:2px;line-height:1.3}
.accion.venta{background:var(--green);color:#fff;min-height:96px}
.accion.venta .ai{background:rgba(255,255,255,.18)}
.accion.dia{background:var(--cyan-l);border-color:#A5E8F4;color:#0B3550;flex-direction:column;align-items:flex-start;min-height:150px}
.accion.dia .ai{background:var(--cyan);color:#0B3550}
.accion.fijo{background:#EAF0FE;border-color:#C3D3FB;color:#0D3B66;flex-direction:column;align-items:flex-start;min-height:150px}
.accion.fijo .ai{background:#D5E1FD;color:var(--green-d)}
.acciones2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guia-sec{background:#F1F6FF;border:1px solid #CFDCFB;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.guia-sec .gs-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.guia-sec .gs-h b{font-size:16px;display:flex;align-items:center;gap:8px}
.guia-sec p{margin:0;font-size:15px;line-height:1.5}
.guia-sec ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45}
.guia-mini{align-self:flex-start;background:#fff;border:1.5px solid #9DB7F7;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--green-d);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-family:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.hero{background:var(--deep);border-color:var(--deep);color:#fff}
.card.hero .lab{color:#C9D8EE}
.card.rose{background:var(--rose);border-color:var(--rose);color:#fff}
.card.rose .lab{color:#C9D8EE}
.lab{font-size:14px;font-weight:700;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.start{justify-content:flex-start}
.col{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.muted{color:var(--muted)} .small{font-size:13.5px} .xs{font-size:12.5px} .strong{font-weight:800}
.sect{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:15px;border:none;font-size:16.5px;font-weight:800;padding:0 18px;text-decoration:none;white-space:nowrap}
.btn.sm{min-height:44px;font-size:14.5px;border-radius:12px;padding:0 14px}
.btn.xs{min-height:38px;font-size:13.5px;border-radius:10px;padding:0 12px}
.btn.block{width:100%}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:var(--green-d)}
.btn-l{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}
.btn-l:hover{background:var(--soft)}
.btn-r{background:var(--rose);color:#fff}
.btn-deep{background:var(--deep);color:#fff}
.btn-deep:hover{background:#0A2F52}
.btn-d{background:#fff;color:var(--bad);border:1.5px solid #E8B4AE}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:#fff;font-size:14.5px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)} .bad{background:var(--bad-bg);color:var(--bad)} .neu{background:#EEF2F7;color:var(--ink2)} .rs{background:var(--rose-l);color:var(--green-d)}
.info{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:1.5px solid #64748B;color:var(--ink2);font-size:13px;font-weight:800;font-family:Georgia,serif;font-style:italic;background:#fff;padding:0;flex:none;line-height:1}
.hero .info,.rose .info{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.alert{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.alert .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.alert .tx{flex:1;min-width:0;font-size:14px;line-height:1.35}
.alert .tx b{display:block;font-size:15px}
.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.line:last-child{border-bottom:none}
.thumb{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.t-rose{background:var(--green-l);color:var(--green-d)} .t-sun{background:#FFF0C7;color:#7A4E00} .t-lily{background:#E8E6F8;color:#4B3FA0} .t-mix{background:#E7EEFE;color:var(--green)} .t-dark{background:#E2E8F0;color:#334155} .t-gift{background:#FDE9DC;color:#8A3B12}
.bar{height:10px;border-radius:99px;background:#E2E8F0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.clickable{cursor:pointer;background:none;border:none;text-align:left;width:100%;color:inherit;padding:0}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.inp{min-height:50px;border-radius:13px;border:1.5px solid var(--line2);background:#fff;padding:0 14px;font-size:16.5px;width:100%}
textarea.inp{padding:12px 14px;min-height:120px;line-height:1.45;resize:vertical}
.inp:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 3px #C7D7FE}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.toggle{width:52px;height:32px;border-radius:99px;background:#CBD5E1;position:relative;flex:none;border:none;padding:0}
.toggle i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--green)}
.optc{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;width:100%;color:var(--ink);font:inherit;cursor:pointer}
.optc b{font-size:16px}.optc.on{border-color:var(--green);background:var(--green-l)}
.optc-r{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.optc.on .optc-r{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 4px #fff}
.toggle.on i{left:24px}

/* vender */
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ptile{position:relative;display:flex;flex-direction:column;gap:5px;padding:6px 6px 10px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:left;color:var(--ink);width:100%}
.ptile img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;background:#F1F5F9;display:block}
.ptile b,.ptile .pr{padding:0 4px}
.ptile.on{border-color:var(--green);background:#EEF3FF}
.ptile .qty{position:absolute;top:-8px;right:-8px;min-width:30px;height:30px;border-radius:15px;background:var(--green);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 7px;z-index:2}
.code{position:absolute;top:12px;left:12px;background:rgba(15,28,46,.84);color:#fff;font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 7px;letter-spacing:.02em}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scrollx .chip{flex:none}
.fotoBig{width:min(100%,340px);aspect-ratio:1/1;object-fit:cover;border-radius:16px;background:#F1F5F9;display:block;margin:0 auto}
.cartline{display:grid;grid-template-columns:minmax(0,1fr) auto 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.stepper span{min-width:24px;text-align:center;font-weight:800}
.vpasos{display:flex;gap:6px;margin-bottom:2px}
.vpasos span{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:13px;font-weight:700;padding:9px 6px;border-radius:12px;background:var(--line);color:var(--muted)}
.vpasos .on{background:var(--green);color:#fff}.vpasos .ok{background:var(--green-l);color:var(--green-d)}
.vsec{background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vsec.falta{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.vsec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}.vsec-h b{font-size:16.5px}
.vmas{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:52px;padding:0 16px;border-radius:16px;border:1.5px dashed var(--line2);background:transparent;font:inherit;font-size:15.5px;font-weight:700;color:var(--green-d);cursor:pointer}
.vfoot{position:sticky;bottom:78px;z-index:15;background:#fff;border:1.5px solid var(--line2);border-radius:20px;padding:12px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(15,28,46,.12)}
@media (min-width:900px){.vfoot{bottom:16px}}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;text-align:left}

/* cómo voy */
.wf{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;min-height:34px;font-size:14.5px}
.wf .v{text-align:right;font-weight:700}
@media (max-width:480px){.wf{grid-template-columns:118px minmax(0,1fr) 104px;font-size:13.5px}}
.days{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.days i{display:block;border-radius:4px 4px 0 0}

/* hoja emergente */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(15,28,46,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h h3{margin:0;flex:1;font-size:21px;font-weight:800}
.x{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:80;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast{pointer-events:none}
.toast button{pointer-events:auto;background:#fff;color:var(--ink);border:none;border-radius:10px;min-height:38px;padding:0 12px;font-weight:800;font-size:14px}
@media (min-width:900px){.toast{bottom:28px}}
.pop{position:fixed;z-index:100;max-width:300px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.pop b{display:block;margin-bottom:2px;font-size:14.5px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.cal button{min-height:44px;border-radius:12px;border:1.5px solid var(--line2);background:#fff;font-weight:800;font-size:15px;padding:0}
.cal button.on{background:var(--green);border-color:var(--green);color:#fff}
.cal button.fut{opacity:.4}
.msgbox{background:#D7F2CF;border-radius:16px;border-top-right-radius:4px;padding:12px 14px;font-size:15px;line-height:1.5;white-space:pre-wrap}

/* guía tipo videojuego */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid #9DB7F7;border-radius:18px;padding:12px 14px}
.hud .bar{background:#E2E8F0}
.mis{display:flex;flex-direction:column;gap:12px}
.mis.next{border:2px solid var(--rose);box-shadow:0 8px 24px rgba(37,99,235,.12)}
.mis.done{background:#F5F8FF}
.mnum{width:38px;height:38px;border-radius:12px;background:var(--green-l);color:var(--green-d);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none}
.mis.done .mnum{background:var(--green);color:#fff}
.mis.skip .mnum{background:#E2E8F0;color:var(--muted)}
.t-hole{position:fixed;z-index:95;border-radius:16px;box-shadow:0 0 0 9999px rgba(15,28,46,.55);outline:3px solid var(--cyan);outline-offset:0;pointer-events:none}
.t-tip{position:fixed;z-index:97;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 18px 44px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;border:2px solid #9DB7F7}
.t-tip .t-k{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d)}
.t-tip b{font-size:17px;line-height:1.3}
.t-tip p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.t-tip .t-miss{font-size:13.5px;color:var(--muted)}
.t-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.t-dots{display:flex;gap:4px}
.t-dots i{width:8px;height:8px;border-radius:50%;background:#E2E8F0;display:block}
.t-dots i.on{background:var(--green)}
.celebra{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;background:#0F1C2E;color:#fff;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;width:min(480px,calc(100% - 24px));box-shadow:0 18px 44px rgba(0,0,0,.35)}
.btn-gold{background:var(--cyan);color:#0B3550}

/* periodo, métricas y buscador */
.perbar{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line2);border-radius:18px;padding:6px}
.perbar .x{border:none;background:var(--soft);width:48px;height:48px}
.perbar .x:disabled{opacity:.3;cursor:default}
.perlbl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:none;border:none;min-height:48px;text-align:center;padding:0 4px;border-radius:12px}
.perlbl:hover{background:var(--soft)}
.perlbl b{font-size:16.5px;line-height:1.25}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi b{font-size:21px;font-weight:800;line-height:1.2}
.cmp{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:#EEF2F7;color:var(--muted);white-space:nowrap}
.cmp.up{background:var(--ok-bg);color:var(--ok)}
.cmp.down{background:var(--bad-bg);color:var(--bad)}
.days .dbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0;background:none;border:none;padding:0;border-radius:4px}
.days .dbar:hover i{filter:brightness(.9)}
.topbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--soft);font-weight:800;font-size:14.5px;color:var(--ink2)}
.bigsearch{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line2);background:#fff;font-size:16px;font-weight:600;color:var(--muted);text-align:left}
.sugs .sug{width:100%}
#pantalla{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px rgba(15,28,46,.08)}
.soporte-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#FFF0C7;color:#6E4700;border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.xs-chip{min-height:38px;padding:0 12px;font-size:13.5px}
.demo-tag.sync-ok{background:var(--ok-bg);color:var(--ok)}
.demo-tag.sync-guardando{background:#EEF2F7;color:var(--muted)}
.demo-tag.sync-error{background:var(--bad-bg);color:var(--bad);cursor:pointer;border:none}

/* Lidera: pasos para configurar */
.ar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ar-dots{display:flex;gap:6px}.ar-dots i{width:34px;height:8px;border-radius:99px;background:var(--line2);display:block}.ar-dots i.on{background:var(--green)}.ar-dots i.ok{background:var(--cyan)}
.ar-fila{display:flex;flex-direction:column;gap:12px;border-color:var(--line2)}
.ar-dia{display:flex;flex-direction:column;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.ar-dia .cal{max-width:420px}
.ar-dia .cal button{min-height:42px}
.ar-meses{grid-template-columns:repeat(6,minmax(0,1fr))!important}
.ar-dia-txt{display:flex;align-items:center;gap:8px;background:#EAF0FE;color:var(--deep);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14.5px}
.ar-total{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#EAF0FE;color:var(--deep);border:1px solid #C3D3FB;border-radius:16px;padding:14px 18px;font-weight:600}
.ar-total b{font-size:22px;font-weight:800}.ar-total small{font-size:13px;font-weight:600;opacity:.8}
/* Lidera: productos propios */
.pfoto-vacia{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;border-radius:11px;background:var(--green-l);color:var(--deep);font-size:40px;font-weight:800}
.np-foto{display:flex;align-items:center;justify-content:center;min-height:170px;border:2px dashed var(--line2);border-radius:16px;background:var(--soft);cursor:pointer;overflow:hidden;color:var(--green-d)}
.np-foto.con{flex-direction:column;gap:8px;min-height:0;padding:12px;border-style:solid;border-width:1px;border-color:var(--line)}
.np-foto img{width:min(260px,100%);aspect-ratio:1/1;object-fit:cover;border-radius:14px;display:block;box-shadow:0 2px 10px rgba(15,28,46,.12)}
/* Lidera: marca */
.marca-login{display:flex;align-items:center;justify-content:center;gap:10px}
.marca-login img{width:52px;height:52px}
.usr-box{display:flex;flex-direction:column;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.linkbtn{align-self:flex-start;background:none;border:none;padding:4px 0;min-height:32px;color:var(--green-d);font-weight:700;font-size:14px;text-decoration:underline;cursor:pointer}
.marca-login b{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--deep);line-height:1}
.marca-login small{display:block;font-size:11.5px;font-weight:600;color:var(--deep);margin-top:3px}
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   Utilidades
   ========================================================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const isoDT = d => `${iso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseD = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAY = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dBetween = (a, b) => Math.round((b - a) / 86400000);
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const DOW = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MESC = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fLarga = d => `${DOW[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}`;
const fCorta = d => `${d.getDate()} ${MESC[d.getMonth()]}`;
const hora = s => { const h = Number(s.slice(11, 13)), m = s.slice(14, 16); const h12 = h % 12 === 0 ? 12 : h % 12; return `${h12}:${m} ${h < 12 ? 'a. m.' : 'p. m.'}`; };
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = Number(String(v).replace(/[^\d-]/g, '')); return isNaN(n) ? 0 : n; };
const phoneFmt = t => { const s = String(t || '').replace(/\D/g, ''); return s.length === 10 ? `${s.slice(0, 3)} ${s.slice(3, 6)} ${s.slice(6)}` : s; };
const initials = n => String(n || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const first = n => String(n || '').split(' ')[0];

const ICONS = {

  chart: '<path d="M12 20V10M18 20V4M6 20v-4"/>',

  flower: '<circle cx="12" cy="12" r="3"/><path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V9m-4.5 3a4.5 4.5 0 1 0 4.5 4.5M7.5 12H9m7.5 0a4.5 4.5 0 1 1-4.5 4.5m4.5-4.5H15m-3 4.5V15"/>',
  gift: '<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8H7.5a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8zm0 0h4.5a2.5 2.5 0 0 0 0-5C13 3 12 8 12 8z"/>',
  cart: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
  wallet: '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>',
  team: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  more: '<circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',

  truck: '<rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/>',
  bus: '<rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 10h18M7 21v-4M17 21v-4"/>',

  up: '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',

  refresh: '<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',

  chevR: '<path d="m9 18 6-6-6-6"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',

};
const ic = (n, s = 20, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ¿Qué hago aquí? Explicación corta arriba de cada sección (se puede ocultar y volver a abrir) */
const GUIAS = {
  inicio: own => ({ t: 'Aquí anotas lo de todos los días, con un toque.', p: ROL() === 'florista' ? ['Cada vez que hagas una venta, toca «Registrar venta».', 'Arriba ves lo que llevas ganado desde tu último pago.'] : [
    'Vendiste algo: toca el botón azul <b>«Registrar venta»</b>.',
    on('gastos') ? 'Pagaste algo del día, como un domicilio, bolsas o transporte: toca <b>«Gasto del día»</b>.' : '',
    on('gastos') ? 'Pagaste el arriendo, los servicios o una cuota: toca <b>«Gasto fijo»</b>.' : '',
    own ? 'Para ver cuánto vendiste y cuánto te quedó, entra a <b>«Resumen»</b>.' : ''] }),
  vender: () => ({ t: 'Aquí anotas cada venta, la de hoy o una de otro día.', p: [
    'Toca la foto de lo que vendiste. Si fueron dos iguales, tócala dos veces.',
    'Toca «Siguiente» y revisa el precio y la fecha.',
    'Responde lo que diga «Obligatorio» y toca «Guardar».',
    on('whatsapp') ? 'También puedes mandarla por WhatsApp con un audio.' : ''] }),
  ventas: () => ({ t: 'La lista de todo lo que has vendido.', p: [
    'Elige arriba los días que quieres ver.',
    'Toca una venta para verla, corregirla o anularla.',
    on('abonos') ? 'Si un cliente dejó un abono, aquí le cobras el saldo cuando pague.' : ''] }),
  productos: own => ({ t: own ? 'Tus productos con su precio y lo que te deja cada uno.' : 'Tus productos con su precio.', p: own ? [
    'Para agregar uno nuevo, toca «Agregar producto»: nombre, precio y si quieres una foto.',
    'Toca un producto para ver lo que lleva y cuánto te queda.',
    `El color te dice si el precio está bien: verde es buen precio (te queda el ${Math.round(ganMin() * 100)}% o más), amarillo está debajo del mínimo y rojo pierdes plata.`,
    'Si sale amarillo o rojo, toca «Usar» para poner el precio mínimo que te sugerimos.'] : ['Busca por nombre o por el código de la foto.'] }),
  compras: () => ({ t: 'Aquí anotas lo que compras para hacer lo que vendes: materiales, empaques o productos.', p: [
    'Elige qué compraste, cuánto y cuánto pagaste por eso.',
    'Si pagaste domicilio, escríbelo en su casilla. No le sube el precio a tus insumos, se cuenta como gasto del mes.',

  gastos: () => ({ t: 'Aquí anotas la plata que sale del negocio y que no es un insumo.', p: [
    '<b>Gastos del día:</b> los que cambian, como domicilios, gasolina o bolsas. Toca el botón y escribe cuánto fue, el día que pasa.',

  equipo: () => ({ t: 'Quién trabaja contigo y cuánto le debes a cada uno.', p: [
    'Agrega a cada persona y cómo le pagas: fijo, por día, por producto o mixto.',
    'Si le pagas por día, marca los días que trabajó.',
    'Cuando le pagues, toca «Pagué» y queda el comprobante.'] }),
  clientes: () => ({ t: 'Tus clientes y sus fechas especiales, para volver a venderles.', p: [
    'Mira «Hoy toca escribirles»: son clientes con un cumpleaños o aniversario cerca.',
    'Toca el botón de WhatsApp y el mensaje sale listo para enviar.',
    'Los clientes se guardan solos cada vez que registras una venta.'] }),
  'como-voy': () => ({ t: 'Aquí ves cuánto vendiste y cuánto te está quedando de verdad.', p: [
    'Arriba eliges los días que quieres mirar: hoy, la semana o el mes.',
    '<b>La meta del mes</b> es lo que tus ventas tienen que dejarte para pagar todos los gastos. Cada venta llena un poco la barra.',
    'Cuando la barra se llena, todo lo que siga entrando es ganancia.'] }),
  'mi-negocio': () => ({ t: 'Los datos y ajustes de tu negocio. Casi siempre lo dejamos listo contigo al empezar.', p: [
    'En «Precios y ganancia» eliges cuánto quieres que te quede de cada producto (mínimo 30%).',
    'En «Personas y WhatsApp» invitas a tu equipo, decides qué puede hacer cada uno y conectas su WhatsApp con Lidera.',
    'Si te equivocas en algo, en «Auditoría» lo puedes deshacer.'] }),
  personas: () => ({ t: 'Aquí decides quién entra a tu negocio, qué puede hacer y con qué WhatsApp le escribe a Lidera.', p: [
    'Toca «Invitar a alguien», escoge si es dueño, asistente o empleado y pon su correo y su WhatsApp.',
    'Lo que puede hacer viene listo según lo que escojas. Si quieres darle más o quitarle algo, toca «Cambiar lo que puede hacer».',
    'Para que Lidera le conteste por WhatsApp, cada persona conecta su número una sola vez: le llega un mensaje listo y lo envía.'] }),
  inventario: () => ({ t: 'Aquí ves cuánto tienes de cada insumo y a qué precio lo compraste.', p: [

    'Si algo se daña o se pierde, tócalo en «Se dañó algo». Si algo no cuadra, «Contar de nuevo».'] }),
  auditoria: () => ({ t: 'Aquí ves quién hizo cada cambio: ventas, gastos, precios, inventario y usuarios.', p: [
    'Toca un nombre para ver solo lo que hizo esa persona.',
    'Toca un tipo, como «Ventas» o «Inventario», para ver solo eso.',
    'Si alguien se equivocó, toca «Deshacer» en ese cambio.'] }),
  funciones: () => ({ t: 'Prende solo lo que usa tu negocio, así la plataforma se ve más sencilla.', p: [
    'Toca el interruptor para prender o apagar una parte.',
    'Lo que tiene candado lo maneja Líderes Locales.'] })
};
const GKEY = () => 'mno-guias-' + ((SES.user && SES.user.id) || 'local');
function guiasOcultas() { try { return JSON.parse(localStorage.getItem(GKEY()) || '[]'); } catch (e) { return []; } }
function guiaSec(k) {
  const f = GUIAS[k]; if (!f) return '';

function seasonDates(y) {

  return [
    { id: 'valentin', nombre: 'San Valentín', fecha: new Date(y, 1, 14) },
    { id: 'mujer', nombre: 'Día de la Mujer', fecha: new Date(y, 2, 8) },
    { id: 'madre', nombre: 'Día de la Madre', fecha: nth(4, 0, 2) },
    { id: 'padre', nombre: 'Día del Padre', fecha: nth(5, 0, 3) },
    { id: 'amistad', nombre: 'Amor y Amistad', fecha: nth(8, 6, 3) },
    { id: 'navidad', nombre: 'Navidad y fin de año', fecha: new Date(y, 11, 24) }
  ];
}
function nextSeason(t) {
  const all = [...seasonDates(t.getFullYear()), ...seasonDates(t.getFullYear() + 1)];
  return all.find(s => s.fecha >= t);
}

    HISTCARGA = true;
    sb.from('historial').select('*').eq('negocio_id', SES.negocio.id).order('id', { ascending: false }).limit(40)
      .then(({ data, error }) => { HISTCARGA = false; HISTDB = error ? [] : data; if (route() === 'mi-negocio' && !sheetFn) render(); });
  }
  const L = HISTDB || [];
  return `<div class="card" id="historial" style="display:flex;flex-direction:column;gap:6px"><span class="row start" style="gap:8px"><b>Historial de cambios</b>${info('historial')}</span>

    return `<div class="list-item" style="flex-wrap:wrap"><span class="col" style="flex:1;gap:2px;min-width:180px"><b style="font-size:15px;${h.deshecho && h.accion !== 'DESHACER' ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(h.descripcion)}</b><span class="small muted">${fCorta(f)} · ${hora(isoDT(f))} · ${esc(h.usuario_nombre || '')}</span></span>

}

function saveCompra(update) {
  const f = UI.compra; const i = insumo(f.iid);
  const cant = Number(String(f.cant).replace(',', '.')) || 0, tot = num(f.total);
  if (!i || !cant || !tot) return toast('Escribe la cantidad y cuánto pagaste');
  const unit = Math.round(tot / cant);
  const now = new Date();
  S.compras.push({ id: uid(), fecha: isoDT(now), iid: i.id, cant, total: tot });
  S.gastos.push({ id: uid(), fecha: isoDT(now), tipo: 'compra', categoria: 'Compra de insumos', monto: tot, nota: `${cant} ${i.nombre.toLowerCase()}` });
  // El domicilio de la compra no se suma al precio de los insumos: es un gasto del día del mes
  const dom = num(f.dom);
  if (dom > 0) S.gastos.push({ id: uid(), fecha: isoDT(now), tipo: 'variable', categoria: 'Domicilio de compras', monto: dom, nota: `Domicilio de la compra de ${i.nombre.toLowerCase()}` });
  let rows = [];
  if (update && unit !== i.precio) {
    const before = {}; S.productos.filter(p => p.receta.some(r => r.iid === i.id)).forEach(p => before[p.id] = margen(p).plimpio);
    i.prev = i.precio; i.precio = unit; i.cambio = iso(TODAY()); i.estimado = false;
    rows = Object.keys(before).map(id => { const p = prod(id); const m = margen(p); return { id, nombre: p.nombre, precio: p.precio, antes: before[id], ahora: m.plimpio, sug: semaforo(m.plimpio)[0] !== 'ok' ? m.minimo : 0 }; }).sort((a, b) => a.ahora - b.ahora);
  }
  UI.compraRes = { nombre: i.nombre, precio: i.precio, rows, dom };
  UI.compra = { iid: i.id, cant: '', total: '', dom: '' };
  S.pasos.compra = true; save(); render(); toast(update && rows.length ? 'Compra guardada y precios actualizados' : 'Compra guardada');
}

/* ---------- Equipo ---------- */

let CS = null;

/* ---------- Meta del mes ----------
   Meta = gastos fijos + sueldos fijos + gastos del día (lo anotado este mes o el promedio de los meses anteriores, lo que sea mayor).
   Cada venta aporta lo que queda después de insumos, mano de obra y comisión. */
function metaMes() {
  const T = TODAY(), ma = new Date(T.getFullYear(), T.getMonth(), 1), fin = new Date(T.getFullYear(), T.getMonth() + 1, 0);
  const rm = resumen(ma, T), ms = mesesBase();
  const fijos = gastosFijosMes(), sueldos = sueldosFijosMes();
  const varReal = variablesEn(ma, T).total;
  const varProm = ms.length ? ms.reduce((s, m) => s + m.variables, 0) / ms.length : 0;
  const variables = Math.max(varReal, varProm);
  const meta = fijos + sueldos + variables;
  const aporte = rm.ventas - rm.insumos - rm.mo - rm.com;
  let porVenta = rm.n ? aporte / rm.n : 0;
  if (porVenta <= 0 && ms.length) { const vs = ms.flatMap(m => ventasEn(m.a, m.b)); porVenta = vs.length ? vs.reduce((s, v) => s + v.quedo, 0) / vs.length : 0; }
  const falta = Math.max(0, meta - aporte);
  // Al ritmo que va el mes: lo que dejarían las ventas hasta fin de mes, menos la meta
  const diasTrans = T.getDate(), diasMes = fin.getDate();
  const proyGan = rm.n && diasTrans >= 3 && diasTrans < diasMes ? Math.round(aporte / diasTrans * diasMes - meta) : null;
  return { meta, fijos, sueldos, variables, varReal, varProm, usaProm: varProm > varReal, aporte, falta, n: rm.n, ganancia: aporte - meta, proyGan,
    pp: meta ? Math.max(0, Math.min(100, pct(aporte, meta))) : 0, ventasFaltan: porVenta > 0 ? Math.ceil(falta / porVenta) : 0, diasQuedan: dBetween(T, fin), mes: MES[T.getMonth()] };
}
function metaHTML() {
  const m = metaMes(); const Mes = m.mes[0].toUpperCase() + m.mes.slice(1);

  const listo = !m.falta;

    <div class="row"><span class="row start" style="gap:8px"><b>La meta de ${m.mes}</b>${info('metaMes')}</span><span class="badge ${listo ? 'ok' : 'neu'}">${listo ? '¡Cumplida!' : `Quedan ${m.diasQuedan} día${m.diasQuedan === 1 ? '' : 's'}`}</span></div>

    <div class="row"><span>Tus ventas ya te dejaron <b class="num">${money(Math.max(0, m.aporte))}</b> ${info('aporte')}</span><b class="num">${m.pp}%</b></div>

      : `Te faltan <b class="num">${money(m.falta)}</b>${m.ventasFaltan ? `, más o menos <b>${m.ventasFaltan} venta${m.ventasFaltan === 1 ? '' : 's'}</b> como las que vienes haciendo` : ''}. Cuando la barra se llene, lo que siga entrando es ganancia.`}</div>
    <div class="row" style="border-top:1px dashed var(--line2);padding-top:10px;flex-wrap:wrap"><span class="row start" style="gap:8px"><b>Tu ganancia de verdad este mes</b>${info('gananciaReal')}</span><b class="num" style="font-size:22px;color:${m.ganancia > 0 ? 'var(--green-d)' : 'var(--muted)'}">${money(Math.max(0, m.ganancia))}</b></div>
    <span class="small" style="line-height:1.5;margin-top:-4px">${m.ganancia > 0 ? 'Es lo que te queda hasta hoy después de pagar insumos, equipo, comisión y todos los gastos del mes.' : 'Todavía no hay ganancia: primero se pagan los gastos del mes.'}${m.proyGan != null ? ` ${m.proyGan >= 0 ? `Al ritmo que vas, a fin de mes te quedarían unos <b class="num">${money(m.proyGan)}</b> de ganancia.` : `Al ritmo que vas, a fin de mes te faltarían unos <b class="num">${money(-m.proyGan)}</b> para cubrir los gastos.`}` : ''}</span>
    <details><summary class="small strong" style="cursor:pointer">¿De dónde sale la meta?</summary>
      <div style="padding:4px 0">
        <div class="line"><span class="row start" style="gap:8px">Gastos fijos ${info('gastosfijos')}</span><span class="num">${money(m.fijos)}</span></div>
        ${on('equipo') ? `<div class="line"><span>Sueldos fijos del equipo</span><span class="num">${money(m.sueldos)}</span></div>` : ''}
        <div class="line"><span class="col" style="gap:0"><span class="row start" style="gap:8px">Gastos del día ${info('otros')}</span><span class="xs muted">${m.usaProm ? `Promedio de tus últimos meses. En ${m.mes} llevas ${money(m.varReal)}.` : `Lo que llevas anotado en ${m.mes}.`}</span></span><span class="num">${money(m.variables)}</span></div>
        <div class="line strong"><span>= Meta de ${Mes}</span><span class="num">${money(m.meta)}</span></div>
      </div></details>
  </div>`;
}

const misState = m => (S.guia && S.guia.estado[m.id]) || 'pend';
const misPend = () => MIS.filter(m => misState(m) === 'pend' && !(['productos', 'precio'].includes(m.id) && !S.productos.length));

function checkMissions() {
  if (!S.guia) return;
  let nueva = null;
  MIS.forEach(m => {
    const st = misState(m);
    if (st !== 'done' && m.done && m.done()) { S.guia.estado[m.id] = 'done'; if (st === 'pend') nueva = m; }
  });
  if (nueva) {
    save();
    if (TOUR && TOUR.mid === nueva.id) { TOUR = null; }
    if (!S.welcome && !SES.admin) celebrate(nueva);
  }
}

function tourStart(id) {

  const root = document.getElementById('tourRoot'); if (!root) return;
  if (!TOUR) { root.innerHTML = ''; return; }
  const m = MIS.find(x => x.id === TOUR.mid); if (!m) { TOUR = null; root.innerHTML = ''; return; }
  const n = m.steps.length;
  let st = m.steps[TOUR.i];
  if (st.back0 && st.back0()) { TOUR.i = 0; st = m.steps[0]; }
  let g = 0;
  while (g++ < 12 && TOUR.i < n - 1) {
    const el0 = st.sel ? document.querySelector(st.sel) : null;
    if ((st.auto && st.auto()) || (st.optional && !el0)) { TOUR.i++; st = m.steps[TOUR.i]; } else break;
  }
  const el = st.sel ? document.querySelector(st.sel) : null;
  if (el && TOUR.sc !== TOUR.i) { TOUR.sc = TOUR.i; el.scrollIntoView({ block: 'center' }); }
  const last = TOUR.i === n - 1;
  const prev = m.steps[TOUR.i - 1];
  const canPrev = TOUR.i > 0 && !(prev && prev.auto && prev.auto());
  const txt = typeof st.text === 'function' ? st.text() : st.text;
  let hole = '';
  if (el) { const r = el.getBoundingClientRect(); hole = `<div class="t-hole" style="left:${r.left - 6}px;top:${r.top - 6}px;width:${r.width + 12}px;height:${r.height + 12}px"></div>`; }
  const k = MIS.indexOf(m) + 1;
  const nextLabel = last ? (m.manual ? 'Misión cumplida' : 'Terminar') : 'Siguiente';
  root.innerHTML = hole + `<div class="t-tip" role="dialog" aria-live="polite" aria-label="Guía paso a paso">
    <div class="row"><span class="t-k">Misión ${k} · Paso ${TOUR.i + 1} de ${n}</span><span class="t-dots" aria-hidden="true">${m.steps.map((x, j) => `<i class="${j <= TOUR.i ? 'on' : ''}"></i>`).join('')}</span></div>
    <b>${esc(st.title)}</b><p>${esc(txt)}</p>
    ${!el && st.sel ? `<p class="t-miss">No vemos esta parte en la pantalla. ${canPrev ? 'Toca «Atrás» o ' : ''}toca «Siguiente» para seguir.</p>` : ''}
    <div class="t-btns"><button type="button" class="btn btn-l xs" data-act="tExit">Salir de la guía</button>
    ${canPrev ? '<button type="button" class="btn btn-l xs" data-act="tPrev">Atrás</button>' : ''}
    ${st.loop != null ? `<button type="button" class="btn btn-l xs" data-act="tLoop">${esc(st.loopLabel)}</button>` : ''}
    <button type="button" class="btn btn-p xs" data-act="tNext">${nextLabel}</button></div></div>`;
  const tip = root.querySelector('.t-tip');
  const W = Math.min(380, window.innerWidth - 24); tip.style.width = W + 'px';
  const h = tip.offsetHeight;
  if (el) {
    const r = el.getBoundingClientRect();
    let top = r.bottom + 14;
    if (top + h > window.innerHeight - 10) top = r.top - 14 - h;
    if (top < 10) top = window.innerHeight - h - 12;
    tip.style.top = Math.max(10, top) + 'px';
    tip.style.left = Math.min(Math.max(12, r.left + r.width / 2 - W / 2), window.innerWidth - W - 12) + 'px';
  } else { tip.style.left = ((window.innerWidth - W) / 2) + 'px'; tip.style.bottom = '24px'; }
}

const GACT = {
  tStart: (el, id) => tourStart(id),
  tExit: () => tourEnd(),
  tPrev: () => { if (!TOUR) return; TOUR.i = Math.max(0, TOUR.i - 1); drawTour(); },
  tLoop: () => { if (!TOUR) return; const m = MIS.find(x => x.id === TOUR.mid); const st = m.steps[TOUR.i]; TOUR.i = st.loop; TOUR.sc = -1; drawTour(); },
  tNext: () => {
    if (!TOUR) return;
    const m = MIS.find(x => x.id === TOUR.mid); const st = m.steps[TOUR.i];
    if (TOUR.i === m.steps.length - 1) {

      if (m.manual && misState(m) !== 'done') { S.guia.estado[id] = 'done'; save(); celebrate(m); render(); }
      return;
    }
    if (st.onNext && !(st.auto && st.auto())) { st.onNext(); drawTour(); return; }
    TOUR.i++; drawTour();
  },
  misSkip: (el, id) => { const m = MIS.find(x => x.id === id); S.guia.estado[id] = 'skip'; if (m.onSkip) m.onSkip(); save(); renderShell(); render(); toast('Misión omitida. La puedes retomar cuando quieras.'); if (!misPend().length && !S.guia.final) { S.guia.final = true; save(); openSheet(finalHTML); } },

/* =========================================================

let INV = null, INVCARGA = false, INVC = { vals: {}, nuevos: [], q: '', f: null }, INVD = { iid: '', cant: '', nota: '' }, INVA = null, INVDES = null;
const fmtC = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('es-CO');
const numC = v => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : n; };
async function cargarInv() {
  if (INVCARGA || !SES.negocio) return; INVCARGA = true;
  try {
    const desde = new Date(Date.now() - 60 * 864e5).toISOString();
    const [lo, fa, mv] = await Promise.all([
      todas('lotes', q => q.order('fecha', { ascending: true }).order('creado', { ascending: true })),
      todas('consumos', q => q.eq('tipo', 'faltante').gte('fecha', desde)),
      todas('movimientos', q => q.gte('creado', desde).order('creado', { ascending: false }))]);
    INV = {
      lotes: lo.map(l => ({ id: l.id, iid: l.insumo_id, fecha: fechaApp(l.fecha), creado: l.creado, ini: nn(l.cantidad_inicial), cant: nn(l.cantidad), costo: nn(l.costo), origen: l.origen, compra: l.compra_id || null })),
      faltas: fa.map(c => ({ iid: c.insumo_id, cant: nn(c.cantidad), fecha: c.fecha })),
      movs: mv.map(m => ({ id: m.id, tipo: m.tipo, iid: m.insumo_id, nombre: m.insumo_nombre, unidad: m.unidad, cant: nn(m.cantidad), costo: nn(m.costo_total), nota: m.nota || '', fecha: fechaApp(m.fecha), quien: m.creado_por }))
    };
  } catch (e) { INV = { error: errTxt(e) }; }
  INVCARGA = false; if (route() === 'inventario' && !sheetFn) render();
}
const invSeguidos = () => new Set((INV && INV.lotes || []).map(l => l.iid));
const invLotes = iid => INV.lotes.filter(l => l.iid === iid && l.cant > 0);
const invHay = iid => invLotes(iid).reduce((s, l) => s + l.cant, 0);
// Lo que se vendió de más (sin estar anotado) después del último conteo o compra de ese insumo
const invFalta = iid => { const ult = INV.lotes.filter(l => l.iid === iid).reduce((m, l) => l.creado > m ? l.creado : m, ''); return INV.faltas.filter(f => f.iid === iid && f.fecha > ult).reduce((s, f) => s + f.cant, 0); };
const usosInsumo = iid => S.productos.filter(p => p.receta.some(r => r.iid === iid)).length;
const nombreDe = uid => { const m = (S.miembros || []).find(x => x.user_id === uid); return m ? first(m.nombre) : 'Líderes Locales'; };
function movTxt(m) {
  const u = m.unidad ? ' ' + m.unidad : '';
  if (m.tipo === 'dano') return `Se dañaron ${fmtC(-m.cant)} de ${m.nombre}${m.costo ? ' · ' + money(m.costo) : ''}${m.nota ? ' · ' + m.nota : ''}`;

   El dueño agrega sus propios productos (con foto opcional)
   ========================================================= */
let NP = null;
// Acomoda cualquier foto a un cuadrado de 720 px, como se ve en la lista de productos:
// si es casi cuadrada se recorta al centro; si es muy alta o muy ancha se ve completa sobre un fondo difuminado de la misma foto.
async function fotoAchicar(file, lado = 720) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height, r = W / H, m = Math.min(W, H);
    const c = document.createElement('canvas'); c.width = c.height = lado;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    if (r > 0.82 && r < 1.22) x.drawImage(img, (W - m) / 2, (H - m) / 2, m, m, 0, 0, lado, lado);
    else {
      const t = document.createElement('canvas'); t.width = t.height = 14;
      t.getContext('2d').drawImage(img, (W - m) / 2, (H - m) / 2, m, m, 0, 0, 14, 14);
      x.drawImage(t, 0, 0, lado, lado);
      x.fillStyle = 'rgba(255,255,255,.28)'; x.fillRect(0, 0, lado, lado);
      const k = Math.min(lado / W, lado / H), w = W * k, h = H * k;
      x.drawImage(img, (lado - w) / 2, (lado - h) / 2, w, h);
    }
    let b = await new Promise(ok => c.toBlob(ok, 'image/webp', 0.84));
    if (!b || b.type !== 'image/webp') b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.86));
    return b;
  } finally { URL.revokeObjectURL(url); }
}
async function fotoSubir(blob) {
  const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
  const path = `${SES.negocio.id}/${Date.now()}-${uid()}.${ext}`;
  const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: blob.type, cacheControl: '31536000', upsert: false });
  if (error) throw error;
  return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
}

async function llamarCuentas(body) {
  try {
    const { data, error } = await sb.functions.invoke('cuentas', { body });
    if (!error) return { data: data || {} };
    const ctx = error.context;
    if (ctx && ctx.status === 404) return { error: 'Falta crear la función «cuentas» en Supabase' };
    try { const j = await ctx.json(); if (j && j.error) return { error: j.error, guardada: !!j.guardada }; } catch (e) { }
    if (/Failed to send|fetch|network/i.test(error.message || '')) return { error: 'No hay conexión a internet. Intenta otra vez.' };
    return { error: errTxt(error) };
  } catch (e) { return { error: errTxt(e) }; }
}

document.addEventListener('submit', async e => {
  const id = e.target.id;
  if (!['fInv', 'fOlvide', 'fNueva'].includes(id)) return; e.preventDefault();
  const v = x => (document.getElementById(x) || {}).value || '';
  if (id === 'fInv') {
    const msg = document.getElementById('ivMsg'), btn = document.getElementById('ivBtn');
    const nombre = v('ivN').trim().replace(/\s+/g, ' '), a = v('ivA'), b = v('ivB');
    if (INVU.manual) INVU.val = v('ivU');
    const u = limpiarUsuario(INVU.val);
    if (nombre.length < 2) { msg.textContent = 'Escribe tu nombre'; return; }
    if (a.length < 6) { msg.textContent = 'La clave debe tener al menos 6 letras o números'; return; }
    if (a !== b) { msg.textContent = 'Las dos claves no son iguales. Escríbelas otra vez.'; return; }
    if (u.length < 3) { msg.textContent = 'El usuario debe tener al menos 3 letras o números'; return; }
    btn.disabled = true; btn.textContent = 'Creando tu entrada…'; msg.textContent = '';
    const r = await llamarCuentas({ accion: 'aceptar', token: INVTOK, usuario: u, clave: a });
    if (r.error) {
      // Si el usuario ya existe, le dejamos escoger otro sin perder lo que escribió
      if (/usuario/i.test(r.error) && !INVU.manual) { INVDATA.nombre = nombre; INVU.manual = true; pantalla(invitacionHTML(r.error)); document.getElementById('ivA').value = a; document.getElementById('ivB').value = b; return; }
      btn.disabled = false; btn.textContent = 'Entrar a Lidera'; msg.textContent = r.error; return;
    }
    INVTOK = null;
    const { data, error } = await sb.auth.signInWithPassword({ email: r.data.email, password: a });
    if (error) { pantalla(entrarHTML(`Tu entrada quedó lista. Entra con tu usuario «${r.data.usuario}» y tu clave.`)); return; }
    if (nombre !== INVDATA.orig) { try { await sb.rpc('guardar_mi_nombre', { p_nombre: nombre }); } catch (e2) { } }
    await entrarCon(data.user);
    toast(`Listo, ya entraste. Tu usuario es «${r.data.usuario}»`);
  }
  if (id === 'fOlvide') {
    const msg = document.getElementById('olMsg'), btn = document.getElementById('olBtn'), dato = v('olU').trim();
    if (!dato) { msg.textContent = 'Escribe tu usuario o tu correo'; return; }
    btn.disabled = true; btn.textContent = 'Enviando…'; msg.textContent = '';
    const r = await llamarCuentas({ accion: 'recuperar', negocio: subdominio(), dato });
    if (r.error) { btn.disabled = false; btn.innerHTML = `${ic('mail', 20)}Enviarme el correo`; msg.textContent = r.error; return; }
    pantalla(olvideListoHTML());
  }
  if (id === 'fNueva') {
    const msg = document.getElementById('nvMsg'), btn = document.getElementById('nvBtn'), a = v('nvA'), b = v('nvB');
    if (a.length < 6) { msg.textContent = 'La clave debe tener al menos 6 letras o números'; return; }
    if (a !== b) { msg.textContent = 'Las dos claves no son iguales. Escríbelas otra vez.'; return; }
    btn.disabled = true; btn.textContent = 'Guardando…'; msg.textContent = '';
    const { data: r, error } = await sb.rpc('recuperacion_usar', { p_token: RECTOK, p_clave: a });
    if (error) { btn.disabled = false; btn.textContent = 'Guardar y entrar'; msg.textContent = errTxt(error); return; }
    RECTOK = null;
    if (!NEG_PUBLICO) { pantalla(entrarHTML('Tu clave quedó cambiada. Entra con ella.')); return; }
    const s2 = await sb.auth.signInWithPassword({ email: correoDe(r.usuario, NEG_PUBLICO.slug), password: a });
    if (s2.error) { pantalla(entrarHTML(`Tu clave quedó cambiada. Entra con tu usuario «${r.usuario}».`)); return; }
    await entrarCon(s2.data.user);
    toast('Listo, tu clave quedó cambiada');
  }
});

/* =========================================================
   Auditoría: quién hizo cada cambio
   ========================================================= */
let AUD = null, AUDCARGA = false, AUDFIN = false;
const AUD_TIPOS = [['todo', 'Todo'], ['ventas', 'Ventas'], ['gastos', 'Gastos y compras'], ['productos', 'Productos y precios'], ['inventario', 'Inventario'], ['usuarios', 'Usuarios y claves'], ['clientes', 'Clientes'], ['equipo', 'Equipo'], ['ajustes', 'Ajustes']];
const audTipo = t => ({ ventas: 'ventas', gastos: 'gastos', gastos_fijos: 'gastos', compras: 'gastos', productos: 'productos', insumos: 'productos', movimientos: 'inventario', miembros: 'usuarios', claves: 'usuarios', invitaciones: 'usuarios', clientes: 'clientes', empleados: 'equipo' })[t] || 'ajustes';
const AUD_DESHACE = ['ventas', 'productos', 'insumos', 'clientes', 'gastos', 'gastos_fijos', 'compras', 'empleados', 'funciones', 'campos', 'ajustes'];
async function cargarAud(mas) {
  if (AUDCARGA) return; AUDCARGA = true;
  const desde = mas && AUD && AUD.length ? AUD[AUD.length - 1].id : null;
  let q = sb.from('historial').select('*').eq('negocio_id', SES.negocio.id).order('id', { ascending: false }).limit(200);
  if (desde) q = q.lt('id', desde);
  const { data, error } = await q;
  AUDCARGA = false;
  if (error) { AUD = AUD || []; toast('No se pudo traer la auditoría: ' + errTxt(error)); }
  else { AUD = (mas ? (AUD || []) : []).concat(data || []); AUDFIN = (data || []).length < 200; }
  if (route() === 'auditoria' && !sheetFn) render();
}
VIEWS.auditoria = () => {
  const cab = `<h2 class="v-title">Auditoría</h2><p class="v-sub">Quién hizo cada cambio en tu negocio, y cuándo.</p>${guiaSec('auditoria')}`;

  const quienes = [...new Set(AUD.map(h => h.usuario_nombre).filter(Boolean))];
  const tipo = UI.audTipo || 'todo', per = UI.audQuien || '';
  const L = AUD.filter(h => (tipo === 'todo' || audTipo(h.tabla) === tipo) && (!per || h.usuario_nombre === per));
  const dias = {}; L.forEach(h => { const d = iso(new Date(h.fecha)); (dias[d] = dias[d] || []).push(h); });
  const hoy = iso(TODAY()), ayer = iso(addD(TODAY(), -1));

  <div class="card" style="display:flex;flex-direction:column;gap:10px">

    <span class="small strong">¿Qué?</span>
    <div class="chips" style="flex-wrap:wrap">${AUD_TIPOS.map(([k, l]) => `<button type="button" class="chip ${tipo === k ? 'on' : ''}" data-act="audTipo" data-v="${k}">${l}</button>`).join('')}</div>
  </div>
  ${L.length ? Object.entries(dias).map(([d, hs]) => `<div class="sect">${diaTxt(d)}</div><div class="card" style="padding:4px 16px">${hs.map(h => { const f = new Date(h.fecha); const puede = !h.deshecho && h.accion !== 'DESHACER' && AUD_DESHACE.includes(h.tabla);
    return `<div class="list-item" style="flex-wrap:wrap;gap:8px"><span class="num small muted" style="min-width:48px">${String(f.getHours()).padStart(2, '0')}:${String(f.getMinutes()).padStart(2, '0')}</span>
      <span class="col" style="flex:1;min-width:170px;gap:2px"><b style="font-size:15px;${h.deshecho && h.accion !== 'DESHACER' ? 'text-decoration:line-through;color:var(--muted)' : ''}">${esc(h.descripcion || '')}</b><span class="small" style="color:var(--green-d);font-weight:700">${esc(h.usuario_nombre || 'Sistema')}</span></span>
      ${!puede ? '' : UI.undoAsk === String(h.id) ? `<span class="row" style="gap:6px"><button type="button" class="btn btn-d xs" data-act="histOk" data-id="${h.id}">Sí, deshacer</button><button type="button" class="btn btn-l xs" data-act="histNo">No</button></span>` : `<button type="button" class="btn btn-l xs" data-act="histAsk" data-id="${h.id}">${ic('undo', 14)}Deshacer</button>`}</div>`; }).join('')}</div>`).join('')
    : '<div class="card empty">No hay cambios con esos filtros.</div>'}
  ${AUDFIN ? '' : `<button type="button" class="btn btn-l block" data-act="audMas">Ver cambios más viejos</button>`}`;

  gfUnpay: (el, id) => { const g = S.gastosFijos.find(x => x.id === id); const c = ciclo(g, TODAY()); g.pagos = g.pagos.filter(k => k !== c.key); save(); render(); },
  gfNew: (el, id, v) => openSheet(() => gfSheet(v ? { nombre: v, valor: 0, frecuencia: 'mensual', dia: 1, mes: 1 } : null)),
  gfEdit: (el, id) => openSheet(() => gfSheet(S.gastosFijos.find(x => x.id === id))),
  gfSave: (el, id) => { const n = document.getElementById('gfn').value.trim(), v = num(document.getElementById('gfv').value); if (!n || !v) return toast('Escribe el nombre y el valor'); const data = { nombre: n, valor: v, frecuencia: document.getElementById('gff').value, dia: Math.max(1, Math.min(31, num(document.getElementById('gfd').value) || 1)), mes: num(document.getElementById('gfm').value) || 1 }; if (id) Object.assign(S.gastosFijos.find(x => x.id === id), data); else S.gastosFijos.push({ id: uid(), pagos: [], ...data }); save(); closeSheet(); render(); toast('Gasto fijo guardado'); },
  gfDel: (el, id) => { const i = S.gastosFijos.findIndex(x => x.id === id); const [g] = S.gastosFijos.splice(i, 1); save(); closeSheet(); render(); toast('Gasto fijo eliminado', () => { S.gastosFijos.splice(i, 0, g); save(); render(); }); },
  // equipo
  empPay: (el, id) => openSheet(() => empPaySheet(emp(id))),
  empPayOk: (el, id) => {
    const e = emp(id); const d = deuda(e); const m = num(document.getElementById('payAmt').value); if (!m) return toast('Escribe cuánto le pagaste');
    const txt = comprobante(e, m, d);
    marca(`Le pagaste ${money(m)} a ${e.nombre}`); S.gastos.push({ id: uid(), fecha: isoDT(new Date()), tipo: 'equipo', categoria: 'Pago a ' + e.nombre, monto: m, nota: 'Pago a ' + e.nombre, empId: e.id });
    e.ultimoPago = isoDT(new Date()); save(); render();
    openSheet(() => `<div class="sheet-h"><h3>Pago registrado</h3><button type="button" class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
      <p class="small muted" style="margin:0">Mándale este comprobante a ${esc(e.nombre)} por WhatsApp.</p><div class="msgbox" id="compTxt">${esc(txt)}</div>
      <button type="button" class="btn btn-p block" data-act="copyComp">${ic('copy', 18)}Copiar comprobante</button>`);
  },
  copyComp: () => copyText(document.getElementById('compTxt').textContent),
  empVale: (el, id) => openSheet(() => `<div class="sheet-h"><h3>Vale para ${esc(emp(id).nombre)}</h3><button type="button" class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="field"><label for="vm">¿Cuánto le diste?</label><input class="inp num" id="vm" data-in="money" inputmode="numeric" placeholder="$0"></div>
    <div class="field"><label for="vn">Nota (opcional)</label><input class="inp" id="vn" placeholder="Ej: adelanto para el transporte"></div>

    <button type="button" class="btn btn-p block" data-act="valeOk" data-id="${id}">${ic('check', 20, 2.6)}Guardar vale</button>`),
  valeOk: (el, id) => { const m = num(document.getElementById('vm').value); if (!m) return toast('Escribe el valor del vale'); emp(id).vales.push({ id: uid(), fecha: isoDT(new Date()), monto: m, nota: document.getElementById('vn').value }); save(); closeSheet(); render(); toast('Vale guardado'); },
  empDias: (el, id) => openSheet(() => empDiasSheet(emp(id))),
  empDia: (el, id, v) => { const e = emp(id); e.dias = e.dias.includes(v) ? e.dias.filter(x => x !== v) : [...e.dias, v].sort(); save(); drawSheet(); render(); },
  empEdit: (el, id) => { ED = JSON.parse(JSON.stringify(emp(id))); openSheet(empEditSheet); },
  empNew: () => { ED = { id: 'e' + uid(), nombre: '', rol: '', tipo: 'dia', valorDia: 60000, valorFijo: 1423500, frecuencia: 'mensual', diaPago: 30, base: 300000, valorProducto: 3000, acceso: 'ninguno', dias: [], vales: [], ultimoPago: isoDT(new Date()), isNew: true }; openSheet(empEditSheet); },
  edTipo: (el, id, v) => { ED.tipo = v; drawSheet(); },
  edSave: () => {
    if (!ED.nombre.trim()) return toast('Escribe el nombre');
    const { isNew, ...e } = ED; e.nombre = e.nombre.trim(); e.rol = e.rol.trim() || 'Equipo';
    const i = S.empleados.findIndex(x => x.id === e.id);
    const porProd = t => t === 'producto' || t === 'mixto';
    const ahoraPorProd = porProd(e.tipo) && !(i >= 0 && porProd(S.empleados[i].tipo));
    if (i >= 0) S.empleados[i] = e; else S.empleados.push(e);
    save(); closeSheet(); render();
    // Si le paga por cada producto, lo que te queda depende de quién lo hizo: se pregunta siempre (se puede apagar en Funcionalidades)
    if (ahoraPorProd && S.campos && S.campos.empleado && !S.campos.empleado.obligatorio && !S.campos.empleado.candado) {
      S.campos.empleado.obligatorio = true;
      if (SES.negocio && sb) sb.from('campos').update({ obligatorio: true }).eq('negocio_id', SES.negocio.id).eq('clave', 'empleado').then(({ error }) => { if (error) { toast('No se pudo cambiar: ' + errTxt(error)); recargarConfig(); } });
      openSheet(() => `<div class="sheet-h"><h3>Desde ahora te preguntamos quién lo hizo</h3><button type="button" class="x" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
        <p style="margin:0;font-size:16px;line-height:1.5">Como a <b>${esc(first(e.nombre))}</b> le pagas por cada producto, en cada venta vas a escoger <b>quién lo hizo</b>. Así se le suma a la persona correcta y lo que te queda sale bien.</p>
        <p class="small muted" style="margin:0;line-height:1.5">Si no quieres que se pregunte siempre, lo apagas en «Funcionalidades», en «Datos que siempre se preguntan».</p>
        <div class="row" style="gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-p" style="flex:1" data-act="close">Entendido</button><button type="button" class="btn btn-l" style="flex:1" data-act="empNoPreguntar">No preguntar siempre</button></div>`);
      return;
    }
    toast('Guardado');
  },
  empNoPreguntar: async () => {
    closeSheet(); if (!S.campos || !S.campos.empleado) return;
    S.campos.empleado.obligatorio = false; render();
    const { error } = await sb.from('campos').update({ obligatorio: false }).eq('negocio_id', SES.negocio.id).eq('clave', 'empleado');
    if (error) { toast('No se pudo cambiar: ' + errTxt(error)); return recargarConfig(); }
    toast('Listo, no se pregunta siempre. Lo puedes prender en Funcionalidades.');
  },
  edDel: () => { const i = S.empleados.findIndex(x => x.id === ED.id); const [e] = S.empleados.splice(i, 1); save(); closeSheet(); render(); toast(`${e.nombre} salió del equipo`, () => { S.empleados.splice(i, 0, e); save(); render(); }); },
  // clientes
  cliOpen: (el, id, v) => { CS = { id, per: v || null, msg: null }; openSheet(cliSheet); },
  cliNew: () => { const c = { id: 'c' + uid(), nombre: 'Cliente nuevo', telefono: '', autoriza: true, personas: [], contactos: [], desde: iso(TODAY()) }; S.clientes.push(c); save(); CS = { id: c.id, per: null, msg: null }; openSheet(cliSheet); render(); },
  csAut: () => { const c = cliente(CS.id); c.autoriza = !c.autoriza; save(); drawSheet(); },
  csPer: (el, id) => { CS.per = id; CS.msg = null; drawSheet(); },
  csPerDel: (el, id) => { const c = cliente(CS.id); c.personas = c.personas.filter(p => p.id !== id); if (CS.per === id) CS.per = null; CS.msg = null; save(); drawSheet(); render(); },
  csPerAdd: () => { const n = document.getElementById('npn').value.trim(); const f = document.getElementById('npf').value; if (!n) return toast('Escribe el nombre de la persona'); const c = cliente(CS.id); const p = { id: uid(), nombre: n, relacion: document.getElementById('npr').value, ocasion: document.getElementById('npo').value, fecha: f ? f.slice(5) : '' }; c.personas.push(p); CS.per = p.id; CS.msg = null; save(); drawSheet(); render(); },
  copyMsg: () => copyText(CS.msg),
  contactar: (el, id, v) => { const c = cliente(id); const T = iso(TODAY()); const ya = c.contactos.find(k => k.fecha === T && k.personaId === (v || null)); if (ya) c.contactos = c.contactos.filter(k => k !== ya); else c.contactos.push({ fecha: T, personaId: v || null }); S.pasos.mensaje = true; save(); if (sheetFn) closeSheet(); render(); if (!ya) toast(`Listo. Si ${first(c.nombre)} compra en los próximos 30 días, cuenta como venta recuperada.`); },
  cliDel: (el, id) => { if (!CS.askDel) { CS.askDel = true; drawSheet(); return; } const i = S.clientes.findIndex(c => c.id === id); const [c] = S.clientes.splice(i, 1); save(); closeSheet(); render(); toast('Cliente eliminado', () => { S.clientes.splice(i, 0, c); save(); render(); }); },
  temporada: () => openSheet(temporadaSheet),
  // cómo voy y configuración
  period: (el, id, v) => { UI.period = v; render(); },
  verBajos: () => { UI.pcat = '__bajo'; UI.pq = ''; location.hash = 'productos'; },
  guiaSec: (el, id, v) => { const L = UI.guiasAbiertas = UI.guiasAbiertas || []; const i = L.indexOf(v); if (i >= 0) L.splice(i, 1); else L.push(v); render(); },
  cfgGan: (el, id, v) => { S.config.gananciaMin = Math.max(GAN_MIN, Number(v)); marca(`Ganancia mínima: ${v}%`); save(); render(); },
  cfgGmodo: (el, id, v) => { S.config.gastosModo = v; marca(v === 'manual' ? 'Pones tú el porcentaje de gastos' : 'La parte de los gastos se calcula sola'); save(); render(); },
  pmodo: (el, id, v) => { marca(v === 'cliente' ? 'Anotas lo que pagó el cliente' : 'Anotas lo que te queda sin comisión'); S.config.precioModo = v; save(); render(); },
  mod: (el, id, v) => { S.config.mods[v] = !S.config.mods[v]; save(); renderShell(); render(); },
  resetAsk: (el, id, v) => { UI.resetAsk = v; render(); },
  resetNo: () => { UI.resetAsk = false; render(); },
  resetOk: () => { marca(UI.resetAsk === 'zero' ? 'Volviste a empezar las pruebas' : 'Cargaste la floristería de ejemplo'); const z = UI.resetAsk === 'zero'; UI.resetAsk = false; S = z ? emptyState() : seed(); save(); D = null; UI.compraRes = null; TOUR = null; document.getElementById('celebraRoot').innerHTML = ''; go('inicio'); render(); if (!z) toast('Floristería de ejemplo cargada'); },
  pcat: (el, id, v) => { UI.pcat = v; render(); },
  vcat: (el, id, v) => { UI.vcat = v; render(); },
  verCambios: () => openSheet(cambiosSheet),
  copyCambios: () => copyText((S.cambiosPrecio || []).map(c => c.nuevo ? `${c.code} ${c.nombre}: producto nuevo, ${money(c.ahora)}` : `${c.code} ${c.nombre}: ${money(c.antes)} → ${money(c.ahora)}`).join('\n')),
  ...GACT,
  ...EXT_ACT,
  ...SB_ACT,
  ...PANEL_ACT,
  ...PINV_ACT,
  ...AR_ACT,
  ...NP_ACT,
  ...PCFG_ACT,
  ...INV_ACT,
  ...CLAVE_ACT,
  ...AUD_ACT,
  vSinDom: () => { D.dom = 0; render(); },
  vEnt: (el, id, v) => { D.entrega = v; if (v === 'tienda') D.dom = 0; else if (!D.dom) D.dom = null; render(); if (v === 'domicilio') { const e = document.getElementById('vdom'); if (e) e.focus(); } }
};
function copyText(t) {
  try { navigator.clipboard.writeText(t).then(() => toast('Copiado'), () => toast('No se pudo copiar. Selecciona el texto y cópialo.')); }
  catch (e) { toast('No se pudo copiar. Selecciona el texto y cópialo.'); }
}

const INP = {
  ...INV_INP,
  rol: el => { S.rol = el.value; save(); D = null; if (!navFor().some(n => n.id === route())) location.hash = 'inicio'; renderShell(); render(); },
  money: el => { const n = num(el.value); el.value = n ? money(n) : ''; },
  vq: el => { D.q = el.value; document.getElementById('sugs').innerHTML = sugsHTML(); },
  vnn: el => { D.nuevo.nombre = el.value; },
  vnt: el => { D.nuevo.telefono = el.value; },
  pn: el => { D.per.nombre = el.value; },
  pf: el => { D.per.fecha = el.value; },
  vparte: el => { D.parte = num(el.value); el.value = D.parte ? money(D.parte) : ''; updFoot(); },
  vPrecio: el => { const n = num(el.value); D.items[el.dataset.id].precio = n; el.value = n ? money(n) : ''; updFoot(); },
  pd: el => { const k = el.dataset.k; if (k === 'nombre') PD.nombre = el.value; else { PD[k] = num(el.value); el.value = PD[k] ? money(PD[k]) : ''; } pdRefresh(); },
  pdIns: el => { const i = Number(el.dataset.i); if (el.value === '__new') { RET = { pd: PD, i }; openSheet(() => insSheet(null)); return; } PD.receta[i].iid = el.value; pdRefresh(); },
  pdCant: el => { PD.receta[Number(el.dataset.i)].cant = Number(String(el.value).replace(',', '.')) || 0; pdRefresh(); },
  cIns: el => { UI.compra.iid = el.value; render(); },
  cCant: el => { UI.compra.cant = el.value; updCompra(); },
  cTot: el => { UI.compra.total = num(el.value); el.value = UI.compra.total ? money(UI.compra.total) : ''; updCompra(); },
  cDom: el => { UI.compra.dom = num(el.value); el.value = UI.compra.dom ? money(UI.compra.dom) : ''; },
  ed: el => { ED[el.dataset.k] = num(el.value); el.value = ED[el.dataset.k] ? money(ED[el.dataset.k]) : ''; },
  edT: el => { const k = el.dataset.k; ED[k] = k === 'diaPago' ? num(el.value) : el.value; },
  pq: el => { UI.pq = el.value; const L = filtrarProductos(UI.pq, UI.pcat); document.getElementById('pgrid').innerHTML = pgridHTML(L); document.getElementById('pcount').textContent = `${L.length} producto${L.length === 1 ? '' : 's'}`; },
  vps: el => { UI.vps = el.value; document.getElementById('vgrid').innerHTML = vgridHTML(); },
  cq: el => { UI.cq = el.value; const q = UI.cq.trim().toLowerCase(); const lista = S.clientes.map(c => { const vs = S.ventas.filter(v => v.clienteId === c.id); return { c, n: vs.length, tot: vs.reduce((s, v) => s + v.total, 0), last: vs.length ? vs[vs.length - 1].fecha : '' }; }).filter(x => !q || x.c.nombre.toLowerCase().includes(q) || x.c.telefono.includes(q.replace(/\D/g, '') || '@@')).sort((a, b) => a.last < b.last ? 1 : -1); document.getElementById('cliList').innerHTML = cliListHTML(lista); },
  cs: el => { const c = cliente(CS.id); if (el.dataset.k === 'telefono') c.telefono = el.value.replace(/\D/g, ''); else c.nombre = el.value; save(); const b = document.getElementById('waBtn'); if (b) b.href = waLink(c.telefono, CS.msg); },
  csMsg: el => { CS.msg = el.value; const c = cliente(CS.id); const b = document.getElementById('waBtn'); if (b) b.href = waLink(c.telefono, CS.msg); },
  cfg: el => { S.config[el.dataset.k] = el.value; save(); if (el.dataset.k !== 'plantilla') renderShell(); },
  cfgNum: el => { S.config[el.dataset.k] = Number(el.value); save(); render(); },
  ...EXT_INP,
  ...SB_INP,
  pq2: el => { UI.pq2 = el.value; render(); },
  ppct: async el => { PPCT = Number(el.value); const { error } = await sb.from('negocios').update({ comision_pct: PPCT }).eq('id', PNEG); toast(error ? 'No se pudo cambiar: ' + errTxt(error) : `Comisión en ${PPCT}%`); }
};
// Actualiza el pie de la venta sin cambiar el botón «Guardar», para que el toque no se pierda al salir de un campo
function updFoot() {
  const f = document.getElementById('vfoot'); if (!f || !D) return;
  const t = document.createElement('div'); t.innerHTML = footHTML();
  const bn = t.querySelector('[data-act=vSave]'), bo = f.querySelector('[data-act=vSave]');
  if (bn && bo && t.children.length === f.children.length) {
    f.replaceChild(t.firstElementChild, f.firstElementChild);
    if (bo.outerHTML !== bn.outerHTML) bo.replaceWith(bn);
  } else f.innerHTML = t.innerHTML;
}
function updCompra() { const f = UI.compra; const i = insumo(f.iid); const cant = Number(String(f.cant).replace(',', '.')) || 0, tot = num(f.total); const unit = cant ? Math.round(tot / cant) : 0; const diff = i && unit ? pct(unit - i.precio, i.precio) : 0; const el = document.getElementById('cCalc'); if (el) el.innerHTML = compraCalcHTML(i, unit, diff); }

document.addEventListener('click', e => {
  const pop = document.getElementById('popRoot');
  if (pop.innerHTML && !e.target.closest('.info')) pop.innerHTML = '';
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el, el.dataset.id, el.dataset.v, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (!el) return; const f = INP[el.dataset.in]; if (f && !['money', 'vPrecio', 'cTot', 'cDom', 'vparte', 'ed', 'vdom', 'vabono'].includes(el.dataset.in) && !(el.dataset.in === 'pd' && el.dataset.k !== 'nombre')) f(el, e); });
// Los campos de plata se formatean al salir del campo, para no mover el cursor mientras se escribe
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (!el) return; const k = el.dataset.in; if (['money', 'vPrecio', 'cTot', 'cDom', 'vparte', 'ed', 'vdom', 'vabono'].includes(k) || (k === 'pd' && el.dataset.k !== 'nombre')) INP[k](el, e); });
document.addEventListener('keyup', e => { const el = e.target.closest('[data-in]'); if (!el) return; const k = el.dataset.in; if (k === 'vPrecio') { D.items[el.dataset.id].precio = num(el.value); updFoot(); } if (k === 'vparte') { D.parte = num(el.value); updFoot(); } if (k === 'vdom') { D.dom = num(el.value); updFoot(); } if (k === 'vabono') { D.abono = num(el.value); } if (k === 'cTot') { UI.compra.total = num(el.value); updCompra(); } if (k === 'pd' && el.dataset.k !== 'nombre') { PD[el.dataset.k] = num(el.value); pdRefresh(); } if (k === 'ed') { ED[el.dataset.k] = num(el.value); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (document.getElementById('popRoot').innerHTML) document.getElementById('popRoot').innerHTML = ''; else if (TOUR) tourEnd(); else if (sheetFn && !sheetLock) ACT.close(); } });
window.addEventListener('hashchange', () => { if (SES.modo === 'panel') { window.scrollTo(0, 0); render(); return; } if (!S || CARGANDO) return; if (route() === 'mi-negocio') HISTDB = null; if (D && D.editId && route() !== 'vender') D = null; if (TOUR) { const m = MIS.find(x => x.id === TOUR.mid); if (m && route() !== m.route) TOUR = null; } window.scrollTo(0, 0); renderShell(); render(); });
let tRaf = 0; const tReq = () => { if (!TOUR) return; cancelAnimationFrame(tRaf); tRaf = requestAnimationFrame(drawTour); };
window.addEventListener('resize', tReq); document.addEventListener('scroll', tReq, true); document.addEventListener('input', tReq);

function render() {
  if (SES.modo === 'panel') {
    const act = document.activeElement && document.activeElement.id;
    renderPanelShell(); document.getElementById('view').innerHTML = VIEWS[panelRuta()]();
    if (act) { const el = document.getElementById(act); if (el && el.tagName === 'INPUT') { el.focus(); try { const L = el.value.length; el.setSelectionRange(L, L); } catch (e) { } } }
    return;
  }
  if (!S || !S.config || CARGANDO) return;
  const r = route();
  const v = document.getElementById('view');
  const active = document.activeElement && document.activeElement.id;
  v.innerHTML = (SES.admin ? `<div class="soporte-bar"><span>Estás en <b>soporte</b> de ${esc(S.config.negocio)}. Lo que cambies queda a nombre de Líderes Locales.</span><button type="button" class="btn btn-l xs" data-act="volverPanel">${ic('chevL', 16, 2.4)}Volver al panel</button></div>` : '') + hudHTML(r) + (VIEWS[r] || VIEWS.inicio)();
  renderShell();
  if (active) { const el = document.getElementById(active); if (el && el.tagName === 'INPUT') { el.focus(); try { const L = el.value.length; el.setSelectionRange(L, L); } catch (e) { } } }
  checkMissions();
  if (!ARAUTO && S.welcome && !S.demo && ROL() === 'duena' && !SES.admin && !S.config.arranque && r !== 'empezar' && !sheetFn) { ARAUTO = true; location.hash = 'empezar'; return; }
  drawTour();
}

arrancar();
</script>
